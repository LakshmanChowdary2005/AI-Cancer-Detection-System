<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physician &amp; Staff Gateway — MediScan AI</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/hospital_portal.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      backdrop-filter: var(--glass-backdrop);
      padding: 36px 32px;
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }
    .login-brand-icon {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      background: linear-gradient(135deg, #3b82f6 0%, #00f2fe 100%);
      color: #060a17;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 14px;
      box-shadow: var(--shadow-glow);
    }
    .login-brand h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .login-brand p {
      font-size: 0.88rem;
      color: var(--muted-light);
    }
    .alert-error {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      background: var(--danger-bg);
      border: 1px solid rgba(255, 77, 109, 0.3);
      color: var(--danger);
      font-size: 0.88rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .demo-box {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      
      <!-- Brand Header -->
      <div class="login-brand">
        <div class="login-brand-icon">
          <i class="fa-solid fa-hospital-user"></i>
        </div>
        <div style="font-size:0.75rem; letter-spacing:1.2px; text-transform:uppercase; color:#38bdf8; font-weight:800; margin-bottom:6px; display:inline-flex; align-items:center; gap:6px;">
          <span class="hospital-radar-dot"></span> Memorial Oncology Network &bull; EMR Auth
        </div>
        <h1>Physician &amp; Staff Gateway</h1>
        <p>Enterprise clinical authentication for PACS diagnostic workstations &amp; inpatient tumor boards</p>
      </div>

      <!-- Error Alert -->
      {% if error %}
      <div class="alert-error">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Quick Clinical Account Quick-Fill Chips -->
      <div style="margin-bottom: 22px;">
        <div style="font-size: 0.76rem; font-weight: 800; text-transform: uppercase; color: #38bdf8; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;">
          <span><i class="fa-solid fa-id-card-clip"></i> 1-Click Clinical Staff Pass</span>
          <span style="font-size: 0.7rem; color: #94a3b8; font-weight: 500;">Password: password123</span>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <button type="button" class="btn btn-secondary role-quick-chip" onclick="fillCredentials('doctor@mediscan.ai', 'password123', 'Doctor')" style="padding: 7px 10px; font-size: 0.74rem; text-align: left; display: flex; align-items: center; gap: 6px; border-radius: 8px;">
            <i class="fa-solid fa-user-doctor" style="color: #38bdf8;"></i>
            <div>
              <strong style="display: block; color: #f1f5f9;">Dr. Sharma</strong>
              <span style="font-size: 0.65rem; color: #94a3b8;">Attending Doctor</span>
            </div>
          </button>

          <button type="button" class="btn btn-secondary role-quick-chip" onclick="fillCredentials('radiology@mediscan.ai', 'password123', 'Radiologist')" style="padding: 7px 10px; font-size: 0.74rem; text-align: left; display: flex; align-items: center; gap: 6px; border-radius: 8px;">
            <i class="fa-solid fa-x-ray" style="color: #06b6d4;"></i>
            <div>
              <strong style="display: block; color: #f1f5f9;">Dr. Wei</strong>
              <span style="font-size: 0.65rem; color: #94a3b8;">Radiologist</span>
            </div>
          </button>

          <button type="button" class="btn btn-secondary role-quick-chip" onclick="fillCredentials('oncology@mediscan.ai', 'password123', 'Oncologist')" style="padding: 7px 10px; font-size: 0.74rem; text-align: left; display: flex; align-items: center; gap: 6px; border-radius: 8px;">
            <i class="fa-solid fa-dna" style="color: #a855f7;"></i>
            <div>
              <strong style="display: block; color: #f1f5f9;">Dr. Sarah</strong>
              <span style="font-size: 0.65rem; color: #94a3b8;">Medical Oncologist</span>
            </div>
          </button>

          <button type="button" class="btn btn-secondary role-quick-chip" onclick="fillCredentials('surgery@mediscan.ai', 'password123', 'Surgeon')" style="padding: 7px 10px; font-size: 0.74rem; text-align: left; display: flex; align-items: center; gap: 6px; border-radius: 8px;">
            <i class="fa-solid fa-syringe" style="color: #f59e0b;"></i>
            <div>
              <strong style="display: block; color: #f1f5f9;">Dr. Mehta</strong>
              <span style="font-size: 0.65rem; color: #94a3b8;">Surgical Oncologist</span>
            </div>
          </button>

          <button type="button" class="btn btn-secondary role-quick-chip" onclick="fillCredentials('nurse@mediscan.ai', 'password123', 'Nurse')" style="padding: 7px 10px; font-size: 0.74rem; text-align: left; display: flex; align-items: center; gap: 6px; border-radius: 8px;">
            <i class="fa-solid fa-user-nurse" style="color: #10b981;"></i>
            <div>
              <strong style="display: block; color: #f1f5f9;">Nurse Adams</strong>
              <span style="font-size: 0.65rem; color: #94a3b8;">Infusion Specialist</span>
            </div>
          </button>

          <button type="button" class="btn btn-secondary role-quick-chip" onclick="fillCredentials('admin@mediscan.ai', 'password123', 'Admin')" style="padding: 7px 10px; font-size: 0.74rem; text-align: left; display: flex; align-items: center; gap: 6px; border-radius: 8px;">
            <i class="fa-solid fa-shield-halved" style="color: #ef4444;"></i>
            <div>
              <strong style="display: block; color: #f1f5f9;">Hospital Admin</strong>
              <span style="font-size: 0.65rem; color: #94a3b8;">Audit &amp; Compliance</span>
            </div>
          </button>
        </div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" method="POST">
        
        <div class="form-group">
          <label class="form-label" for="email"><i class="fa-solid fa-envelope"></i> Clinical Email or Username</label>
          <input type="text" id="email" name="email" class="form-input" placeholder="doctor@mediscan.ai or doctor" required autofocus />
        </div>

        <div class="form-group">
          <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px; padding: 10px;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Clinical Gateway
        </button>

      </form>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px;">
        <a href="/" style="color: var(--muted); font-size: 0.82rem; text-decoration: none;">
          <i class="fa-solid fa-arrow-left"></i> Diagnostic Portal
        </a>
        <a href="/patient/login" style="color: #34d399; font-size: 0.82rem; text-decoration: none; font-weight: 700;">
          <i class="fa-solid fa-hospital-user"></i> Patient Login Portal &rarr;
        </a>
      </div>

    </div>
  </div>

  <script>
    function fillCredentials(email, password, role) {
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      emailInput.value = email;
      passwordInput.value = password;
      if (role) {
        localStorage.setItem('mediscan_role', role);
      }
      emailInput.focus();
    }
  </script>
  <script src="/static/js/hospital_live.js"></script>
  <script src="/static/js/hospital_translate.js"></script>
</body>
</html>
